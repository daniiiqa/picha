[package]
name = "picha"
version = "0.1.1"
edition = "2024"
description = "Quick Share for Linux: your Android phone te picha files, a la carne asada"
license = "MIT"
repository = "https://github.com/daniiiqa/picha"

[dependencies]
aes = "0.8"
base64 = "0.23.1"
bytes = "1.12.1"
cbc = { version = "0.1", features = ["alloc"] }
clap = { version = "4.6.7", features = ["derive"] }
hkdf = "0.12"
hmac = "0.12"
mdns-sd = "0.21.6"
p256 = { version = "0.13", features = ["ecdh", "arithmetic"] }
prost = "0.14.4"
qrcode = { version = "0.14.1", default-features = false }
rand = "0.8"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs", "signal", "process"] }
unicode-width = "0.2.3"
futures-util = { version = "0.3", default-features = false }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[build-dependencies]
prost-build = "0.14.4"
protox = "0.10.0"
